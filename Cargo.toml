[workspace]
resolver = "2"
members = [
    "libcachesim-core",
    "libcachesim-eviction",
    "libcachesim-datastructures",
    "libcachesim-trace",
    "libcachesim-analysis",
    "libcachesim-cli",
    "libcachesim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["libCacheSim Rust Port Team"]
license = "GPL-3.0"
repository = "https://github.com/tiemobang/libCacheSim-rust"
homepage = "https://libcachesim.com"
keywords = ["cache", "simulation", "algorithms"]
categories = ["simulation", "algorithms"]

[workspace.dependencies]
# Error handling
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# High-performance collections
hashbrown = "0.14"

# For atomic operations
